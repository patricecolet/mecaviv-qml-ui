# Sortie fixe du pedalier.
#
# Pd ouvre son PCM ALSA une fois au demarrage et ne le rouvre jamais. Si la
# cible n est pas la a ce moment -- casque Bluetooth eteint --, il boucle sur
# « alsa xrun recovery apparently failed » et ne traite plus rien : le
# WebSocket cesse de repondre et le pedalier entier devient inutilisable.
#
# Ce sink existe toujours, indepandamment du materiel. Pd ecrit dedans, et le
# loopback ci-dessous porte le son vers la sortie reelle du moment (le casque).
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "pedalier-out"
      node.description = "Pedalier (sortie fixe)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      monitor.channel-volumes = true
    }
  }
]
