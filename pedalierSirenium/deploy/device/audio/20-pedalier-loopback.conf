# Porte la sortie fixe vers le casque.
#
# `target.object` est EXPLICITE et ne doit jamais l'etre sur "pedalier-out" :
# sans cible nommee, le loopback suit le sink par defaut, et quand le casque
# s'absente ce defaut devient la sortie fixe elle-meme -- le monitor du sink
# rentre alors dans le sink, ce qui produit un larsen numerique continu.
# Constate en vrai le 2026-08-27.
#
# Casque absent, le loopback ne joue nulle part : c'est voulu. Pd, lui, continue
# d'ecrire dans la sortie fixe sans jamais s'en apercevoir.
#
# Changer de casque veut dire changer ce nom :
#   pactl list sinks short   ->  bluez_output.<MAC avec des _>.1
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Pedalier -> casque"
      capture.props = {
        node.name           = "pedalier-loopback-in"
        target.object       = "pedalier-out"
        stream.capture.sink = true
        node.passive        = true
      }
      playback.props = {
        node.name     = "pedalier-loopback-out"
        target.object = "bluez_output.4F_BC_21_8A_93_EF.1"
        media.class   = Stream/Output/Audio
      }
    }
  }
]
