# Porte la sortie fixe vers le peripherique reel. Sans target.object, le
# loopback suit le sink par defaut : le casque quand il est la, rien sinon --
# et « rien » ne fait plus tomber Pd, puisqu il n ecrit jamais dessus
# directement.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Pedalier -> sortie"
      capture.props = {
        node.name   = "pedalier-loopback-in"
        target.object = "pedalier-out"
        stream.capture.sink = true
        node.passive = true
      }
      playback.props = {
        node.name = "pedalier-loopback-out"
        media.class = Stream/Output/Audio
      }
    }
  }
]
